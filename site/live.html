<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Live meelopen – Kadans</title>
<meta name="theme-color" content="#13110E">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
:root{
  --bg:#13110E; --surface:#1C1814; --surface-high:#25201B; --border:#352E26;
  --accent:#D9BF92; --accent-deep:#B8955F; --accent-light:#F0DDB6;
  --text:#F1E9DC; --muted:#BDB1A0; --subtle:#94897A; --good:#8CC99A; --danger:#EF7F78;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
#map{flex:1;min-height:0;background:#17171A}
.leaflet-tile-pane{filter:invert(1) grayscale(1) brightness(.62) contrast(1.15)}
.leaflet-container{font-family:inherit}
.leaflet-control-attribution{background:rgba(0,0,0,.55)!important;color:#bbb!important;font-size:10px}
.leaflet-control-attribution a{color:#ddd!important}
.leaflet-bar a{background:var(--surface)!important;color:var(--text)!important;border-color:var(--border)!important}
header{position:absolute;z-index:1000;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;align-items:center;gap:10px;pointer-events:none}
.pill{pointer-events:auto;background:rgba(19,17,14,.9);border:1px solid var(--border);border-radius:8px;padding:8px 14px;display:flex;align-items:center;gap:8px;backdrop-filter:blur(6px)}
.brand img{height:22px;display:block}.brand .adans{display:block;flex:none;aspect-ratio:737/102;background:currentColor;-webkit-mask:url(kadans-adans.png) center/contain no-repeat;mask:url(kadans-adans.png) center/contain no-repeat;height:9px;color:#D9BF92;margin-bottom:0}.pill.brand{align-items:flex-end;gap:5px}
.panel{background:var(--surface);border-top:1px solid var(--border);padding:16px 20px calc(16px + env(safe-area-inset-bottom))}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.name{font-family:Saira,sans-serif;font-weight:800;font-size:22px;margin:0;line-height:1.1}
.status{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;border-radius:8px;padding:4px 10px}
.status.live{background:rgba(74,222,128,.14);color:var(--good)}
.status.stale{background:rgba(245,197,66,.14);color:#F5C542}
.status.ended{background:rgba(141,141,152,.16);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.live .dot{animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.6)}70%{box-shadow:0 0 0 9px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--surface-high);border-radius:8px;padding:10px 12px}
.stat b{display:block;font-family:Saira,sans-serif;font-weight:800;font-size:20px}
.stat span{font-size:12px;color:var(--subtle)}
.note{color:var(--subtle);font-size:12px;margin:10px 0 0}
.msg{padding:40px 24px;text-align:center;color:var(--muted)}
.msg h1{font-family:Saira,sans-serif;font-weight:800;color:var(--text);font-size:26px;margin:0 0 8px}
.runner{width:22px;height:22px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 6px rgba(253,138,38,.3),0 2px 8px rgba(0,0,0,.6)}
button.follow{pointer-events:auto;margin-left:auto;background:rgba(19,17,14,.9);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font:600 13px 'DM Sans',sans-serif;cursor:pointer}
button.follow[aria-pressed="true"]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.cheers{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.cheers button{flex:1 1 auto;min-width:72px;border:1px solid var(--border);background:var(--surface-high);color:inherit;border-radius:8px;padding:9px 12px;font:600 14px 'DM Sans',sans-serif;cursor:pointer}
.cheers button:disabled{opacity:.5;cursor:default}
.cheers button.sent{border-color:#D9BF92;color:#D9BF92}
.alert{display:none;background:#B42318;color:#fff;padding:12px 20px;font:600 15px 'DM Sans',sans-serif}
.alert.on{display:block}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="pill brand"><img src="kadans-mark.png" alt="Kadans"><span class="adans" aria-hidden="true"></span></div>
  <button class="follow" id="follow" aria-pressed="true" type="button">Volgen</button>
</header>
<div class="alert" id="alert" role="alert"></div>
<div id="map" role="region" aria-label="Kaart met de live locatie"></div>
<div class="panel" id="panel">
  <div class="row"><p class="name" id="name">Laden…</p><span class="status ended" id="status"><span class="dot"></span><span id="statusText">verbinden</span></span></div>
  <div class="stats">
    <div class="stat"><b id="dist">–</b><span>afgelegd</span></div>
    <div class="stat"><b id="time">–</b><span>onderweg</span></div>
    <div class="stat"><b id="seen">–</b><span>laatste update</span></div>
  </div>
  <div class="cheers" id="cheers" aria-label="Aanmoedigen">
    <button data-k="hup">👏 Hup!</button>
    <button data-k="top">💪 Top bezig</button>
    <button data-k="bijna">🏁 Bijna!</button>
    <button data-k="trots">❤️ Trots</button>
  </div>
  <p class="note" id="note">De kaart ververst vanzelf elke 15 seconden.</p>
</div>
<script src="vendor/leaflet/leaflet.js"></script>
<script>
(function () {
  var API = 'https://jdswennyfczpqblfkrxt.supabase.co/functions/v1/live-share';
  var token = new URLSearchParams(location.search).get('t') || '';
  var $ = function (id) { return document.getElementById(id); };

  function fail(title, text) {
    document.body.innerHTML = '<div class="msg"><h1>' + title + '</h1><p>' + text + '</p></div>';
  }
  if (!/^[A-Za-z0-9]{24,64}$/.test(token)) {
    fail('Deze link klopt niet', 'Vraag de loper om de link opnieuw te sturen.');
    return;
  }

  var map = L.map('map', { zoomControl: true, attributionControl: true }).setView([52.1, 5.3], 8);
  L.tileLayer('https://service.pdok.nl/brt/achtergrondkaart/wmts/v2_0/grijs/EPSG:3857/{z}/{x}/{y}.png', {
    maxZoom: 19, minZoom: 6, attribution: 'Kaart © Kadaster / PDOK'
  }).addTo(map);
  var glow = L.polyline([], { color: '#D9BF92', weight: 14, opacity: .22 }).addTo(map);
  var line = L.polyline([], { color: '#D9BF92', weight: 5, opacity: 1, lineJoin: 'round' }).addTo(map);
  var marker = null, accuracy = null, follow = true, first = true, data = null;

  $('follow').addEventListener('click', function () {
    follow = !follow;
    this.setAttribute('aria-pressed', String(follow));
    if (follow && marker) map.panTo(marker.getLatLng());
  });
  map.on('dragstart', function () { follow = false; $('follow').setAttribute('aria-pressed', 'false'); });

  function haversine(a, b) {
    var R = 6371000, r = Math.PI / 180;
    var dLat = (b[0] - a[0]) * r, dLon = (b[1] - a[1]) * r;
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
  }
  function fmtDuration(ms) {
    var s = Math.max(0, Math.round(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
    return h > 0 ? h + ':' + String(m).padStart(2, '0') + ' u' : m + ' min';
  }
  function fmtAgo(ms) {
    var s = Math.max(0, Math.round(ms / 1000));
    if (s < 60) return s + ' s';
    if (s < 3600) return Math.round(s / 60) + ' min';
    return Math.round(s / 3600) + ' uur';
  }

  function render() {
    if (!data) return;
    var now = Date.now();
    $('name').textContent = data.name;
    document.title = data.name + ' – live meelopen';
    var trail = (data.trail || []).map(function (p) { return [p[0], p[1]]; });
    var meters = 0;
    for (var i = 1; i < trail.length; i++) meters += haversine(trail[i - 1], trail[i]);
    $('dist').textContent = (meters / 1000).toFixed(1).replace('.', ',') + ' km';
    $('time').textContent = fmtDuration((data.ended_at ? Date.parse(data.ended_at) : now) - Date.parse(data.started_at));

    var lastAt = data.last && data.last.at ? Date.parse(data.last.at) : null;
    $('seen').textContent = lastAt ? fmtAgo(now - lastAt) : '–';
    var st = $('status'), stText = $('statusText');
    if (!data.active) {
      st.className = 'status ended';
      stText.textContent = data.ended_at ? 'run gestopt' : 'delen verlopen';
      $('note').textContent = 'Het live delen is gestopt. De locatie is niet meer zichtbaar.';
    } else if (!lastAt || now - lastAt > 3 * 60 * 1000) {
      st.className = 'status stale';
      stText.textContent = lastAt ? 'even geen signaal' : 'wacht op locatie';
      $('note').textContent = 'Geen recente update. Mogelijk slecht bereik of staat de telefoon even stil.';
    } else {
      st.className = 'status live';
      stText.textContent = 'live';
      $('note').textContent = 'De kaart ververst vanzelf elke 15 seconden.';
    }

    var al = $('alert');
    if (data.active && data.alert && data.alert.kind === 'fall') {
      al.className = 'alert on';
      al.textContent = '⚠️ Mogelijk gevallen' + (data.alert.at ? ' (om ' + new Date(data.alert.at).toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' }) + ')' : '') +
        '. De loper reageerde niet. Bel hem of haar, of bel 112 als je geen contact krijgt. De laatste plek staat op de kaart.';
    } else {
      al.className = 'alert';
    }
    $('cheers').style.display = data.active ? 'flex' : 'none';

    line.setLatLngs(trail);
    glow.setLatLngs(trail);
    if (data.last) {
      var ll = [data.last.lat, data.last.lon];
      if (!marker) {
        marker = L.marker(ll, { icon: L.divIcon({ className: '', html: '<div class="runner"></div>', iconSize: [22, 22], iconAnchor: [11, 11] }) }).addTo(map);
        accuracy = L.circle(ll, { radius: 1, color: '#D9BF92', weight: 1, opacity: .4, fillOpacity: .1 }).addTo(map);
      }
      marker.setLatLng(ll);
      accuracy.setLatLng(ll).setRadius(Math.min(data.last.accuracy || 0, 200));
      if (first) { map.setView(ll, 15); first = false; }
      else if (follow) map.panTo(ll);
    } else if (!data.active && marker) {
      map.removeLayer(marker); map.removeLayer(accuracy); marker = null;
    }
  }

  // Aanmoedigen: de loper hoort het in zijn oortjes ("Hup van Anna!").
  var myName = '';
  try { myName = localStorage.getItem('kadans_cheer_name') || ''; } catch (e) {}
  document.querySelectorAll('#cheers button').forEach(function (b) {
    b.addEventListener('click', function () {
      if (!myName) {
        myName = (prompt('Je naam (die hoort de loper):', '') || '').trim().slice(0, 30);
        try { localStorage.setItem('kadans_cheer_name', myName); } catch (e) {}
      }
      var all = document.querySelectorAll('#cheers button');
      all.forEach(function (x) { x.disabled = true; });
      fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t: token, kind: b.dataset.k, name: myName }) })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (res) {
          $('note').textContent = res.ok ? 'Verstuurd! De loper hoort het zo.' : (res.j.error || 'Dat lukte niet.');
          if (res.ok) b.classList.add('sent');
        })
        .catch(function () { $('note').textContent = 'Geen verbinding.'; })
        .finally(function () { setTimeout(function () { all.forEach(function (x) { x.disabled = false; }); }, 20000); });
    });
  });

  function load() {
    fetch(API + '?t=' + encodeURIComponent(token), { cache: 'no-store' })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) { fail('Niet (meer) beschikbaar', res.j.error || 'Deze link is verlopen.'); clearInterval(timer); return; }
        data = res.j;
        render();
        if (!data.active) clearInterval(timer);
      })
      .catch(function () {
        $('note').textContent = 'Geen verbinding. We proberen het zo opnieuw.';
      });
  }
  var timer = setInterval(load, 15000);
  setInterval(render, 5000);
  load();
})();
</script>
</body>
</html>
