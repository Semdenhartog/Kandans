<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Route – Kadans</title>
<meta name="theme-color" content="#13110E">
<meta property="og:title" content="Een route uit Kadans">
<meta property="og:description" content="Bekijk de route en bewaar hem in Kadans.">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
:root{--bg:#13110E;--surface:#1C1814;--border:#352E26;--gold:#D9BF92;--gold-deep:#B8955F;--gold-light:#F0DDB6;--text:#F1E9DC;--muted:#BDB1A0;--subtle:#94897A}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
#map{flex:1;min-height:280px;background:#1A1612}
.leaflet-tile-pane{filter:sepia(.35) brightness(.7) contrast(1.1)}
.leaflet-control-attribution{background:rgba(0,0,0,.55)!important;color:#ccc!important;font-size:10px}
.leaflet-control-attribution a{color:#eee!important}
.panel{background:var(--surface);border-top:1px solid var(--border);padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.brand{font-family:Saira,sans-serif;font-weight:800;letter-spacing:.4em;color:var(--gold);font-size:12px;margin:0 0 6px}
h1{font-family:Saira,sans-serif;font-weight:800;font-size:26px;margin:0 0 4px;line-height:1.1}
.meta{color:var(--muted);margin:0 0 14px}
.btn{display:block;width:100%;padding:14px 18px;border-radius:999px;font-weight:600;font-size:16px;text-decoration:none;text-align:center;margin-bottom:8px}/* unslop-ignore: pil alleen voor knoppen, bewuste keuze */
.primary{background:var(--gold);color:#1A1510}
.secondary{border:1.5px solid var(--border);color:var(--text)}
.note{font-size:13px;color:var(--subtle);margin:6px 0 0}
.wrap{max-width:560px;margin:0 auto}
.err{padding:40px 16px;text-align:center;color:var(--muted)}
.facts{display:flex;gap:8px;margin:0 0 12px}
.fact{flex:1;background:var(--bg,#13110E);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.fact b{display:block;font-family:Saira,sans-serif;font-weight:800;font-size:20px;color:var(--text)}
.fact span{font-size:12px;color:var(--subtle)}
#profile{display:block;width:100%;height:64px;margin:0 0 14px}
</style>
</head>
<body>
<div id="map"></div>
<section class="panel"><div class="wrap">
  <p class="brand">KADANS</p>
  <h1 id="name">Gedeelde route</h1>
  <p class="meta" id="meta"></p>
  <div class="facts" id="facts" hidden>
    <div class="fact"><b id="f-km">–</b><span>afstand</span></div>
    <div class="fact"><b id="f-up">–</b><span>omhoog</span></div>
    <div class="fact"><b id="f-time">–</b><span>op 6:00/km</span></div>
  </div>
  <svg id="profile" viewBox="0 0 300 64" preserveAspectRatio="none" aria-label="Hoogteprofiel" hidden></svg>
  <a class="btn primary" id="open" href="#">Opslaan in Kadans</a>
  <a class="btn secondary" id="gpx" href="#" download="route.gpx">Download als GPX</a>
  <p class="note">Met Kadans zie je het beste moment om deze route te lopen, de wind onderweg en zet je hem op je horloge.</p>
</div></section>
<script src="vendor/leaflet/leaflet.js"></script>
<script>
(function () {
  var params = new URLSearchParams(location.hash.replace(/^#/, ''));
  var name = (params.get('n') || 'Gedeelde route').slice(0, 60);
  var poly = params.get('p') || '';

  function decode(str) {
    var i = 0, lat = 0, lng = 0, out = [];
    while (i < str.length) {
      var b, shift = 0, result = 0;
      do { b = str.charCodeAt(i++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20 && i < str.length);
      lat += (result & 1) ? ~(result >> 1) : (result >> 1);
      shift = 0; result = 0;
      do { b = str.charCodeAt(i++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20 && i < str.length);
      lng += (result & 1) ? ~(result >> 1) : (result >> 1);
      out.push([lat / 1e5, lng / 1e5]);
    }
    return out;
  }
  function dist(a, b) {
    var R = 6371000, r = Math.PI / 180;
    var dLat = (b[0] - a[0]) * r, dLon = (b[1] - a[1]) * r;
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  function esc(s) { return s.replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]; }); }

  var pts = [];
  try { pts = decode(poly); } catch (e) { pts = []; }
  document.getElementById('name').textContent = name;
  if (pts.length < 2) {
    document.getElementById('map').outerHTML = '<p class="err">In deze link zit geen route. Vraag of iemand hem opnieuw deelt.</p>';
    document.getElementById('open').style.display = 'none';
    document.getElementById('gpx').style.display = 'none';
    return;
  }
  var m = 0;
  for (var k = 1; k < pts.length; k++) m += dist(pts[k - 1], pts[k]);
  var km = (m / 1000).toFixed(1).replace('.', ',') + ' km';
  var up = parseInt(params.get('h') || '', 10);
  var ele = (params.get('e') || '').split('.').map(Number).filter(function (x) { return isFinite(x); }).slice(0, 48);
  var min = Math.round(m / 1000 * 6);
  var time = min >= 60 ? Math.floor(min / 60) + ' u ' + (min % 60) + ' min' : min + ' min';
  document.getElementById('meta').textContent = 'Start bij de witte stip.';
  document.getElementById('f-km').textContent = km;
  document.getElementById('f-up').textContent = isFinite(up) ? up + ' m' : '–';
  document.getElementById('f-time').textContent = time;
  document.getElementById('facts').hidden = false;
  if (ele.length >= 3) {
    var lo = Math.min.apply(null, ele), hi = Math.max.apply(null, ele);
    var span = Math.max(hi - lo, 15);
    var xy = ele.map(function (v, i) {
      return (i / (ele.length - 1) * 300).toFixed(1) + ',' + (60 - (v - lo) / span * 52).toFixed(1);
    });
    var svg = document.getElementById('profile');
    svg.innerHTML = '<polygon points="0,64 ' + xy.join(' ') + ' 300,64" fill="#D9BF92" fill-opacity=".22"/>'
      + '<polyline points="' + xy.join(' ') + '" fill="none" stroke="#D9BF92" stroke-width="2" vector-effect="non-scaling-stroke"/>';
    svg.setAttribute('aria-label', 'Hoogteprofiel: tussen ' + Math.round(lo) + ' en ' + Math.round(hi) + ' meter');
    svg.hidden = false;
  }

  var map = L.map('map', { zoomControl: true, attributionControl: true });
  L.tileLayer('https://service.pdok.nl/brt/achtergrondkaart/wmts/v2_0/grijs/EPSG:3857/{z}/{x}/{y}.png', {
    maxZoom: 19, minZoom: 6, attribution: 'Kaart © Kadaster / PDOK'
  }).addTo(map);
  var line = L.polyline(pts, { color: '#D9BF92', weight: 5, opacity: .95 }).addTo(map);
  L.circleMarker(pts[0], { radius: 7, color: '#13110E', weight: 3, fillColor: '#F0DDB6', fillOpacity: 1 }).addTo(map);
  map.fitBounds(line.getBounds(), { padding: [24, 24] });

  document.getElementById('open').href = 'runwise://app/route-delen?n=' + encodeURIComponent(name) + '&p=' + encodeURIComponent(poly);

  var gpx = '<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Kadans" xmlns="http://www.topografix.com/GPX/1/1">\n'
    + '<trk><name>' + esc(name) + '</name><trkseg>\n'
    + pts.map(function (p) { return '<trkpt lat="' + p[0].toFixed(5) + '" lon="' + p[1].toFixed(5) + '"/>'; }).join('\n')
    + '\n</trkseg></trk></gpx>\n';
  var a = document.getElementById('gpx');
  a.href = URL.createObjectURL(new Blob([gpx], { type: 'application/gpx+xml' }));
  a.download = (name.replace(/[^A-Za-z0-9 _-]/g, '').trim().replace(/ /g, '-') || 'route') + '.gpx';
})();
</script>
</body>
</html>
