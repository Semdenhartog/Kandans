name: runwise
description: RunWise - loop op het beste moment. Berekent de beste vertrektijd op basis van weer, route en je eigen prestaties.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.18.3
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  http: ^1.2.2
  geolocator: ^14.1.1
  file_picker: ^13.1.0
  xml: ^6.5.0
  intl: any
  url_launcher: ^6.3.1
  purchases_flutter: ^9.13.0
  health: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/logo/

# App-icoon (wordt in de cloudbuild gemaakt met: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#09090B"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  min_sdk_android: 26
