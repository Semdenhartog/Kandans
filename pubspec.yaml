name: runwise
description: RunWise - loop op het beste moment. Berekent de beste vertrektijd op basis van weer, route en je eigen prestaties.
publish_to: 'none'
version: 1.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.18.3
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  http: ^1.2.2
  geolocator: ^14.1.1
  file_picker: ^13.1.0
  xml: ^7.1.0
  intl: any
  url_launcher: ^6.3.1
  purchases_flutter: ^10.18.1
  health: ^13.3.0
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  shared_preferences: ^2.3.0
  flutter_map: ^8.1.0
  latlong2: ^0.10.1
  share_plus: ^13.0.0
  android_intent_plus: ^6.1.0
  flutter_tts: ^4.2.0
  wakelock_plus: ">=1.2.0 <2.0.0"
  battery_plus: ">=6.0.0 <8.0.0"
  screen_brightness: ">=2.0.0 <3.0.0"
  quick_actions: ">=1.0.0 <2.0.0"
  audioplayers: ">=6.0.0 <7.0.0"
  local_auth: ^3.0.2
  vibration: ^3.1.0
  flutter_reactive_ble: ^5.4.0
  permission_handler: ">=12.0.0 <14.0.0"
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  home_widget: ^0.10.0
  in_app_review: ">=2.0.0 <3.0.0"

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
    - assets/sounds/
    - assets/fonts/OFL-Saira.txt
    - assets/fonts/OFL-DMSans.txt
  fonts:
    - family: Saira
      fonts:
        - asset: assets/fonts/Saira-Bold.ttf
          weight: 700
        - asset: assets/fonts/Saira-ExtraBold.ttf
          weight: 800
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700

# App-icoon (wordt in de cloudbuild gemaakt met: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#09090B"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  adaptive_icon_monochrome: "assets/icon/monochrome.png"
  min_sdk_android: 26
