name: Website (GitHub Pages)

# Zet de map site/ online op https://kadans.fit (eigen domein sinds 7-11-2026; oud adres semdenhartog.github.io/Kandans stuurt door)
# (live meekijken via live.html, de privacyverklaring en de landingspagina).
# Eenmalig nodig: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # Openbare Supabase-gegevens (URL en anon-sleutel, dezelfde als in de app) in de wachtlijst zetten.
      - name: Wachtlijst koppelen aan Supabase
        run: |
          python3 - <<'PY'
          import json, pathlib
          c = json.load(open("app_config.json"))
          for f in pathlib.Path("site").glob("*.html"):
              s = f.read_text(encoding="utf-8")
              if "__SUPABASE_URL__" in s:
                  s = s.replace("__SUPABASE_URL__", c["SUPABASE_URL"]).replace("__SUPABASE_ANON_KEY__", c["SUPABASE_ANON_KEY"])
                  f.write_text(s, encoding="utf-8")
                  print(f"::notice::Wachtlijst gekoppeld in {f.name}")
          PY
      # Kaartbibliotheek Leaflet zelf meeleveren (geen unpkg.com): zo gaan er geen IP-adressen van bezoekers naar derden.
      - name: Leaflet meeleveren
        run: |
          cd "$RUNNER_TEMP" && npm pack leaflet@1.9.4 --silent && tar -xzf leaflet-1.9.4.tgz
          mkdir -p "$GITHUB_WORKSPACE/site/vendor/leaflet"
          cp -r package/dist/leaflet.js package/dist/leaflet.css package/dist/images package/LICENSE "$GITHUB_WORKSPACE/site/vendor/leaflet/"
      # Eigen domein kadans.fit: DNS controleren en (eenmalig) koppelen. Lukt het koppelen niet met deze sleutel,
      # dan staat in de melding wat Sem met de hand moet doen (Settings → Pages → Custom domain).
      - name: Eigen domein (kadans.fit)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DOMEIN: kadans.fit
        run: |
          echo "A-records:"; dig +short "$DOMEIN" A
          echo "www:"; dig +short "www.$DOMEIN" CNAME
          huidig=$(gh api "repos/${{ github.repository }}/pages" --jq '.cname // ""' || true)
          echo "Nu ingesteld: '$huidig'"
          if [ "$huidig" != "$DOMEIN" ]; then
            if dig +short "$DOMEIN" A | grep -q '^185\.199\.10[89]\.\|^185\.199\.11[01]\.'; then
              gh api -X PUT "repos/${{ github.repository }}/pages" -f cname="$DOMEIN" \
                && echo "::notice::$DOMEIN gekoppeld" \
                || echo "::warning::Koppelen lukte niet automatisch: zet $DOMEIN bij Settings → Pages → Custom domain"
            else
              echo "::warning::DNS van $DOMEIN wijst nog niet naar GitHub; later opnieuw draaien"
            fi
          fi
          gh api "repos/${{ github.repository }}/pages" --jq '{cname, https_enforced, html_url}' || true
          echo "https:"; curl -sI -m 15 "https://$DOMEIN/" | head -1 || echo "nog geen https-certificaat"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
