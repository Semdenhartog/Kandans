name: Website (GitHub Pages)

# Zet de map site/ online op https://semdenhartog.github.io/Runwise/
# (live meekijken via live.html, de privacyverklaring en de landingspagina).
# Eenmalig nodig: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # Openbare Supabase-gegevens (URL en anon-sleutel, dezelfde als in de app) in de wachtlijst zetten.
      - name: Wachtlijst koppelen aan Supabase
        run: |
          python3 - <<'PY'
          import json, pathlib
          c = json.load(open("app_config.json"))
          for f in pathlib.Path("site").glob("*.html"):
              s = f.read_text(encoding="utf-8")
              if "__SUPABASE_URL__" in s:
                  s = s.replace("__SUPABASE_URL__", c["SUPABASE_URL"]).replace("__SUPABASE_ANON_KEY__", c["SUPABASE_ANON_KEY"])
                  f.write_text(s, encoding="utf-8")
                  print(f"::notice::Wachtlijst gekoppeld in {f.name}")
          PY
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
