# Zet de startkennis van de coach (supabase/coach_kennis/*.txt) in de database.
# Upsert op sleutel: onderwerpen die in de beheerpagina zijn aangepast (bron = 'sem') blijven staan,
# net als voorbeeldvragen van gebruikers en door Claude toegevoegde onderwerpen.
# Gebruikt hetzelfde GitHub-geheim als supabase-functies.yml: SUPABASE_ACCESS_TOKEN.
name: Coach-kennis laden

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/coach_kennis/**"
      - "tools/coach_kennis_naar_sql.py"

jobs:
  laden:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: jdswennyfczpqblfkrxt
    steps:
      - uses: actions/checkout@v4
      - name: Controleren en omzetten
        run: |
          python3 tools/coach_kennis_naar_sql.py --tel
          python3 tools/coach_kennis_naar_sql.py > /tmp/kennis.sql
      - name: Naar Supabase
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::GitHub-geheim SUPABASE_ACCESS_TOKEN ontbreekt."; exit 1; fi
          python3 -c "import json,sys; print(json.dumps({'query': open('/tmp/kennis.sql').read()}))" > /tmp/body.json
          code=$(curl -sS -o /tmp/uit.json -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data-binary @/tmp/body.json)
          echo "HTTP $code"; head -c 600 /tmp/uit.json; echo
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ] || exit 1
          python3 -c "import json; print(json.dumps({'query': \"select count(*) filter (where actief) as actief, count(*) as totaal, (select count(*) from public.coach_vragen) as vragen from public.coach_kennis\"}))" > /tmp/tel.json
          curl -sS -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data-binary @/tmp/tel.json
