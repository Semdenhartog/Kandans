# Zet de server-functies (Edge Functions) live in Supabase.
# Starten: GitHub -> Actions -> "Supabase-functies live zetten" -> Run workflow.
# Eenmalig nodig: GitHub-geheim SUPABASE_ACCESS_TOKEN (Supabase -> Account -> Access Tokens).
name: Supabase-functies live zetten

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: jdswennyfczpqblfkrxt
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Controleren of het geheim er is
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Zet eerst het GitHub-geheim SUPABASE_ACCESS_TOKEN (zie README)."
            exit 1
          fi

      # Met login-controle door Supabase: alleen ingelogde app-gebruikers.
      - name: coach en delete-account
        run: |
          supabase functions deploy coach --project-ref "$PROJECT_REF"
          supabase functions deploy delete-account --project-ref "$PROJECT_REF"
          supabase functions deploy route-generator --project-ref "$PROJECT_REF"
          supabase functions deploy street-photos --project-ref "$PROJECT_REF"
          supabase functions deploy poster-order --project-ref "$PROJECT_REF"

      # Zonder login-controle door Supabase: Strava en RevenueCat roepen deze zelf aan;
      # de functies controleren zelf wie er belt.
      - name: strava en revenuecat-webhook
        run: |
          supabase functions deploy strava --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy revenuecat-webhook --project-ref "$PROJECT_REF" --no-verify-jwt
          # De live-locatiepagina wordt zonder account bekeken; het geheime token in de link is de toegang.
          supabase functions deploy live-share --project-ref "$PROJECT_REF" --no-verify-jwt
          # Stripe belt zelf; de functie controleert de handtekening van Stripe.
          supabase functions deploy stripe-webhook --project-ref "$PROJECT_REF" --no-verify-jwt
