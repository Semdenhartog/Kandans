# Maakt schermafbeeldingen van de belangrijkste schermen (met voorbeeldgegevens),
# zodat de layout bekeken kan worden zonder telefoon. Plaatjes staan bij de run onder "Artifacts".
name: Schermen

on:
  push:
    paths:
      - 'lib/**'
      - 'test_screens/**'
      - '.github/workflows/screens.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Schermafbeeldingen maken
        run: flutter test test_screens --update-goldens --reporter expanded 2>&1 | tee screens.txt
        continue-on-error: true
      - name: Fouten tonen
        if: always()
        run: |
          grep -E "EXCEPTION CAUGHT|══╡|was thrown|overflowed|Error:|\[E\]" -A3 screens.txt | head -80 | while IFS= read -r line; do
            echo "::warning title=Schermen::$line"
          done
          ls -la test_screens/goldens || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schermen
          path: |
            test_screens/goldens/*.png
            screens.txt
          retention-days: 14
      - name: Plaatjes in branch 'schermen' zetten
        if: always()
        run: |
          mkdir -p /tmp/out && cp test_screens/goldens/*.png screens.txt /tmp/out/ 2>/dev/null || true
          cd /tmp/out
          git init -q -b schermen
          git config user.name "RunWise CI"
          git config user.email "ci@runwise.invalid"
          git add -A && git commit -qm "Schermen ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" schermen
          # Ook per branch, zodat twee branches elkaars plaatjes niet overschrijven.
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" "schermen:schermen-${GITHUB_REF_NAME}"
