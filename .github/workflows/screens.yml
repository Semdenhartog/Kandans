# Maakt schermafbeeldingen van de belangrijkste schermen (met voorbeeldgegevens),
# zodat de layout bekeken kan worden zonder telefoon. Plaatjes staan bij de run onder "Artifacts".
name: Schermen

on:
  push:
    paths:
      - 'lib/**'
      - 'test_screens/**'
      - '.github/workflows/screens.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screens:
    # Dependabot mag niet naar de schermen-branches schrijven; de build is daar genoeg als controle.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Schermafbeeldingen maken
        run: flutter test test_screens --update-goldens --reporter expanded 2>&1 | tee screens.txt
        continue-on-error: true
      - name: Fouten tonen
        if: always()
        run: |
          grep -E "EXCEPTION CAUGHT|══╡|was thrown|overflowed|Error:|\[E\]" -A3 screens.txt | head -80 | while IFS= read -r line; do
            echo "::warning title=Schermen::$line"
          done
          ls -la test_screens/goldens || true
      - name: Play Store-plaatjes (1080 x 1920)
        if: always()
        run: |
          pip install --quiet pillow
          python3 .github/scripts/store_screens.py test_screens/goldens test_screens/goldens/store || true
      - name: Uit beeld-controle
        # De schermtests zelf mogen falen (nepdata, geen Supabase), maar tekst of knoppen die
        # uit beeld vallen (RenderFlex overflowed) zijn echte fouten: dan wordt deze stap rood.
        if: always()
        run: |
          n=$(grep -c "overflowed by" screens.txt || true)
          if [ "$n" -gt 0 ]; then
            grep -B30 "overflowed by" screens.txt | grep -E "^[0-9]+:[0-9]+ \+" | sed 's/.*: //' | sort -u | while read -r t; do
              echo "::error title=Uit beeld::$t"
            done
            echo "::error::$n keer valt er iets uit beeld. Zie screens.txt (zoek op 'overflowed')."
            echo "uitbeeld=1" >> "$GITHUB_ENV"
          else
            echo "Niets uit beeld."
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: schermen
          path: |
            test_screens/goldens/*.png
            test_screens/goldens/store/*.png
            screens.txt
          retention-days: 14
      - name: Plaatjes in branch 'schermen' zetten
        if: always()
        run: |
          mkdir -p /tmp/out && cp test_screens/goldens/*.png screens.txt /tmp/out/ 2>/dev/null || true
          if [ -d test_screens/goldens/store ]; then mkdir -p /tmp/out/playstore && cp test_screens/goldens/store/*.png /tmp/out/playstore/ 2>/dev/null || true; fi
          cd /tmp/out
          git init -q -b schermen
          git config user.name "RunWise CI"
          git config user.email "ci@runwise.invalid"
          git add -A && git commit -qm "Schermen ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" schermen
          # Ook per branch, zodat twee branches elkaars plaatjes niet overschrijven.
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" "schermen:schermen-${GITHUB_REF_NAME}"

      - name: Rood als er iets uit beeld valt
        if: env.uitbeeld == '1'
        run: exit 1
