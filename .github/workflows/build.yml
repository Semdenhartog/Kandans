# Bouwt RunWise in de cloud bij elke wijziging:
# controleert de code, draait de tests en maakt een APK om op je telefoon te zetten.
name: Build RunWise

on:
  push:
  workflow_dispatch:
    inputs:
      snel:
        description: 'Alleen code nakijken en testen (geen APK, geen emulator)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Ondertekeningssleutel voor de Play Store (staat in GitHub Secrets, nooit in de code).
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Schijfruimte vrijmaken
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules /usr/share/swift || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h / | tail -1

      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter-versie
        run: flutter --version

      - name: RevenueCat-sleutel invullen (uit GitHub Secrets, als die er is)
        env:
          RC_KEY: ${{ secrets.REVENUECAT_ANDROID_KEY }}
        run: |
          if [ -n "$RC_KEY" ]; then
            python3 -c "import json,os; p='app_config.json'; d=json.load(open(p)); d['REVENUECAT_ANDROID_KEY']=os.environ['RC_KEY']; json.dump(d, open(p,'w'), indent=2)"
            echo "::notice::RevenueCat-sleutel ingevuld: Premium kan gekocht worden"
          else
            echo "::warning::Geen REVENUECAT_ANDROID_KEY in GitHub Secrets: Premium kopen werkt nog niet"
          fi

      - name: Android-projectbestanden aanmaken
        run: |
          set -o pipefail
          flutter create --org nl.runwise --project-name runwise --platforms android . 2>&1 | tee create.txt || {
            grep -iE "because|version solving|error|not found|depends on|requires" create.txt | head -25 | while IFS= read -r line; do
              echo "::error title=Pakketten::$line"
            done
            exit 1
          }

      - name: Rechten toevoegen aan AndroidManifest.xml
        run: |
          python3 - <<'EOF'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          if "android.permission.INTERNET" not in s:
              s = s.replace("<application", (
                  '<uses-permission android:name="android.permission.INTERNET"/>\n'
                  '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n'
                  '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n'
                  '    <application'), 1)
          if "android.intent.action.VIEW" not in s:
              s = s.replace("</manifest>", (
                  '    <queries>\n'
                  '        <intent>\n'
                  '            <action android:name="android.intent.action.VIEW" />\n'
                  '            <data android:scheme="https" />\n'
                  '        </intent>\n'
                  '    </queries>\n'
                  '</manifest>'))
          s = s.replace('android:label="runwise"', 'android:label="RunWise"')
          open(p, "w").write(s)
          EOF

      - name: Koppelingen instellen (Health Connect en Strava-terugkeer)
        run: |
          python3 - <<'EOF2'
          import glob, re
          # 1) AndroidManifest: rechten, terugkeer-link van Strava, Health Connect-uitleg
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          if "android.permission.health.READ_EXERCISE" not in s:
              perms = (
                  '<uses-permission android:name="android.permission.health.READ_EXERCISE"/>\n'
                  '    <uses-permission android:name="android.permission.health.READ_DISTANCE"/>\n'
                  '    <uses-permission android:name="android.permission.health.READ_HEART_RATE"/>\n'
                  '    <uses-permission android:name="android.permission.health.WRITE_EXERCISE"/>\n'
                  '    <uses-permission android:name="android.permission.health.WRITE_DISTANCE"/>\n'
                  '    <uses-permission android:name="android.permission.health.WRITE_TOTAL_CALORIES_BURNED"/>\n'
                  '    <uses-permission android:name="android.permission.health.READ_SLEEP"/>\n'
                  '    <uses-permission android:name="android.permission.health.READ_RESTING_HEART_RATE"/>\n'
                  '    <uses-permission android:name="android.permission.health.READ_HEART_RATE_VARIABILITY"/>\n'
                  '    <application')
              s = s.replace("<application", perms, 1)
              filters = (
                  '</intent-filter>\n'
                  '            <intent-filter>\n'
                  '                <action android:name="androidx.health.ACTION_SHOW_PERMISSIONS_RATIONALE" />\n'
                  '            </intent-filter>\n'
                  '            <intent-filter android:autoVerify="false">\n'
                  '                <action android:name="android.intent.action.VIEW" />\n'
                  '                <category android:name="android.intent.category.DEFAULT" />\n'
                  '                <category android:name="android.intent.category.BROWSABLE" />\n'
                  '                <data android:scheme="runwise" android:host="app" />\n'
                  '            </intent-filter>')
              s = s.replace("</intent-filter>", filters, 1)
              alias = (
                  '</activity>\n'
                  '        <activity-alias\n'
                  '            android:name="ViewPermissionUsageActivity"\n'
                  '            android:exported="true"\n'
                  '            android:targetActivity=".MainActivity"\n'
                  '            android:permission="android.permission.START_VIEW_PERMISSION_USAGE">\n'
                  '            <intent-filter>\n'
                  '                <action android:name="android.intent.action.VIEW_PERMISSION_USAGE" />\n'
                  '                <category android:name="android.intent.category.HEALTH_PERMISSIONS" />\n'
                  '            </intent-filter>\n'
                  '        </activity-alias>')
              s = s.replace("</activity>", alias, 1)
              s = s.replace("<queries>", '<queries>\n        <package android:name="com.google.android.apps.healthdata" />', 1)
          open(p, "w").write(s)

          # 1b) Startscherm-widget (bestanden in android_extra/)
          import shutil, os
          if "BestMomentWidget" not in s:
              s = s.replace("</application>", (
                  '    <receiver android:name=".BestMomentWidget" android:exported="true">\n'
                  '            <intent-filter>\n'
                  '                <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />\n'
                  '            </intent-filter>\n'
                  '            <meta-data android:name="android.appwidget.provider" android:resource="@xml/best_moment_widget_info" />\n'
                  '        </receiver>\n'
                  '    </application>'), 1)
              open(p, "w").write(s)
          kdir = os.path.dirname(glob.glob("android/app/src/main/kotlin/**/MainActivity.kt", recursive=True)[0])
          shutil.copy("android_extra/kotlin/BestMomentWidget.kt", kdir)
          for sub in ("layout", "xml", "drawable", "values"):
              os.makedirs(f"android/app/src/main/res/{sub}", exist_ok=True)
              for f in glob.glob(f"android_extra/res/{sub}/*.xml"):
                  shutil.copy(f, f"android/app/src/main/res/{sub}/")
          print("::notice::Widget toegevoegd in", kdir)

          # 2) MainActivity moet een FlutterFragmentActivity zijn (vereist door Health Connect)
          for m in glob.glob("android/app/src/main/kotlin/**/MainActivity.kt", recursive=True):
              k = open(m).read()
              k = k.replace("io.flutter.embedding.android.FlutterActivity", "io.flutter.embedding.android.FlutterFragmentActivity")
              k = re.sub(r":\s*FlutterActivity\(\)", ": FlutterFragmentActivity()", k)
              open(m, "w").write(k)
              print("::notice::MainActivity aangepast:", m)

          # 2b) home_widget bouwt standaard voor Java 8, maar gebruikt onderdelen voor Java 11+: op 17 zetten.
          rg = "android/build.gradle.kts"
          rt = open(rg).read()
          if "home_widget-jvm" not in rt:
              rt += "\n".join([
                  "",
                  "// home_widget-jvm: plugin met Java 17 bouwen (anders 'Cannot inline bytecode built with JVM target 11').",
                  "subprojects {",
                  "    if (name == \"home_widget\") {",
                  "        tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {",
                  "            compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)",
                  "        }",
                  "        val hw: Project.() -> Unit = {",
                  "            extensions.configure<com.android.build.gradle.LibraryExtension> {",
                  "                compileSdk = 37",
                  "                compileOptions {",
                  "                    sourceCompatibility = JavaVersion.VERSION_17",
                  "                    targetCompatibility = JavaVersion.VERSION_17",
                  "                }",
                  "            }",
                  "        }",
                  "        if (state.executed) hw() else afterEvaluate { hw() }",
                  "    }",
                  "}",
                  "",
              ])
              open(rg, "w").write(rt)
          gp = "android/gradle.properties"
          gt = open(gp).read()
          if "kotlin.jvm.target.validation.mode" not in gt:
              gt += "\nkotlin.jvm.target.validation.mode=warning\n"
          # Geheugen begrenzen: de cloudmachine heeft 16 GB; Gradle (8 GB) + Kotlin + R8 tegelijk liep eroverheen (exit 143).
          gt = re.sub(r"(?m)^org\.gradle\.jvmargs=.*$", "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError", gt)
          if "org.gradle.jvmargs" not in gt:
              gt += "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\n"
          if "org.gradle.workers.max" not in gt:
              gt += "org.gradle.workers.max=3\nkotlin.daemon.jvmargs=-Xmx2g\n"
          open(gp, "w").write(gt)

          # 3) Health Connect werkt vanaf Android 8 (API 26)
          g = "android/app/build.gradle.kts"
          t = open(g).read()
          t2 = re.sub(r"minSdk\s*=\s*flutter\.minSdkVersion", "minSdk = 26", t)
          # Bluetooth (hartslagband) en rechten-plugin vragen een nieuwere Android-SDK om mee te bouwen.
          t2 = re.sub(r"compileSdk\s*=\s*flutter\.compileSdkVersion", "compileSdk = 37", t2)
          assert t2 != t or "minSdk = 26" in t, "minSdk niet gevonden"
          open(g, "w").write(t2)
          print("::notice::Health Connect en Strava-terugkeer ingesteld")
          EOF2

      - name: Live locatie delen (voorgrondservice)
        run: |
          python3 - <<'EOF2'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          if "FOREGROUND_SERVICE_LOCATION" not in s:
              s = s.replace("<application", (
                  '<uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n'
                  '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION"/>\n'
                  '    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n'
                  '    <uses-permission android:name="com.android.alarm.permission.SET_ALARM"/>\n'
                  '    <uses-permission android:name="android.permission.USE_BIOMETRIC"/>\n'
                  '    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation"/>\n'
                  '    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>\n'
                  '    <application'), 1)
              open(p, "w").write(s)
          print("::notice::Voorgrondservice voor live delen ingesteld")
          EOF2

      - name: Stemcoach (tekst-naar-spraak)
        run: |
          python3 - <<'EOF2'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          if "android.intent.action.TTS_SERVICE" not in s:
              s = s.replace("<queries>", (
                  '<queries>\n'
                  '        <intent>\n'
                  '            <action android:name="android.intent.action.TTS_SERVICE" />\n'
                  '        </intent>'), 1)
              open(p, "w").write(s)
          print("::notice::Stemcoach ingesteld")
          EOF2

      - name: Meldingen instellen (dagelijkse melding)
        run: |
          python3 - <<'EOF2'
          import re
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          if "POST_NOTIFICATIONS" not in s:
              s = s.replace("<application", (
                  '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n'
                  '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n'
                  '    <application'), 1)
              s = s.replace("</application>", (
                  '    <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n'
                  '        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n'
                  '            <intent-filter>\n'
                  '                <action android:name="android.intent.action.BOOT_COMPLETED"/>\n'
                  '                <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>\n'
                  '                <action android:name="android.intent.action.QUICKBOOT_POWERON" />\n'
                  '            </intent-filter>\n'
                  '        </receiver>\n'
                  '    </application>'), 1)
              open(p, "w").write(s)
          g = "android/app/build.gradle.kts"
          t = open(g).read()
          if "isCoreLibraryDesugaringEnabled" not in t:
              t2 = t.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true", 1)
              assert t2 != t, "compileOptions niet gevonden"
              t2 += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              open(g, "w").write(t2)
          print("::notice::Meldingen ingesteld (rechten, ontvangers, desugaring)")
          EOF2

      - name: Code-inkorting (R8) veilig instellen
        run: |
          cat > android/app/proguard-rules.pro <<'EOF2'
          # Plugins worden deels via JNI/reflectie aangeroepen: niet inkorten of hernoemen.
          -keep class io.flutter.plugins.** { *; }
          -keep class io.flutter.plugin.** { *; }
          -keep class dev.flutter.** { *; }
          -keep class kotlin.coroutines.** { *; }
          -keep class kotlinx.coroutines.** { *; }
          -dontwarn io.flutter.embedding.**
          EOF2
          python3 - <<'EOF2'
          import os
          kts = "android/app/build.gradle.kts"
          groovy = "android/app/build.gradle"
          if os.path.exists(kts):
              s = open(kts).read()
              old = 'signingConfig = signingConfigs.getByName("debug")'
              new = old + '\n            isMinifyEnabled = false\n            isShrinkResources = false\n            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")'
              assert old in s, "release-blok niet gevonden in build.gradle.kts"
              s = s.replace(old, new, 1)
              open(kts, "w").write(s)
          else:
              s = open(groovy).read()
              old = "signingConfig = signingConfigs.debug"
              new = old + "\n            minifyEnabled false\n            shrinkResources false\n            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'"
              assert old in s, "release-blok niet gevonden in build.gradle"
              s = s.replace(old, new, 1)
              open(groovy, "w").write(s)
          print("::notice::R8-inkorting uitgeschakeld en keep-regels toegevoegd")
          EOF2

      - name: Ondertekenen voor de Play Store instellen
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          python3 - <<'EOF2'
          p = "android/app/build.gradle.kts"
          s = open(p).read()
          s = "import java.io.FileInputStream\nimport java.util.Properties\n\n" + s
          block = '''    signingConfigs {
                  create("release") {
                      val props = Properties()
                      props.load(FileInputStream(rootProject.file("key.properties")))
                      keyAlias = props["keyAlias"] as String
                      keyPassword = props["keyPassword"] as String
                      storeFile = file(props["storeFile"] as String)
                      storePassword = props["storePassword"] as String
                  }
              }

              buildTypes {'''
          assert "    buildTypes {" in s, "buildTypes niet gevonden"
          s = s.replace("    buildTypes {", block, 1)
          old = 'signingConfig = signingConfigs.getByName("debug")'
          assert old in s, "debug-ondertekening niet gevonden"
          s = s.replace(old, 'signingConfig = signingConfigs.getByName("release")', 1)
          open(p, "w").write(s)
          print("::notice::Release wordt ondertekend met de uploadsleutel")
          EOF2

      - name: Pakketten downloaden
        run: flutter pub get

      - name: App-icoon en donker opstartscherm
        run: |
          dart run flutter_launcher_icons
          for f in android/app/src/main/res/drawable/launch_background.xml android/app/src/main/res/drawable-v21/launch_background.xml; do
            [ -f "$f" ] || continue
            cat > "$f" <<'EOF2'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item><color android:color="#FF09090B" /></item>
          </layer-list>
          EOF2
            sed -i 's/^          //' "$f"
          done
          echo "::notice::App-icoon (RunWise-logo) en donker opstartscherm ingesteld"

      - name: Analyse-meldingen als annotaties tonen
        run: |
          flutter analyze --format=machine > analyze.txt 2>&1 || true
          python3 - <<'EOF2'
          lines = open("analyze.txt").read().splitlines()
          issues = [l for l in lines if l.count("|") >= 7]
          print(f"::notice::Analyse: {len(issues)} meldingen ({len(lines)} regels uitvoer)")
          for line in lines:
              parts = line.strip().split("|")
              if len(parts) < 8:
                  continue
              sev, typ, code, path, ln, col = parts[:6]
              msg = "|".join(parts[7:])
              level = "error" if sev == "ERROR" else "warning"
              path = path.split("/runwise/")[-1] if "/runwise/" in path else path
              print(f"::{level} file={path},line={ln},col={col}::[{sev}/{code}] {msg}")
          EOF2

      - name: Code controleren
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze-plain.txt || {
            # Fouten als annotaties tonen, zodat ze ook zonder de volledige log leesbaar zijn.
            grep -E "error •|warning •" analyze-plain.txt | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      - name: Tests
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee tests-plain.txt || {
            # Mislukte tests als annotaties tonen, zodat ze ook zonder de volledige log leesbaar zijn.
            grep -E -A6 "\[E\]|Expected:|  Actual:|Which:" tests-plain.txt | grep -v "^--$" | head -60 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      - name: Horloge-bestand (FIT) controleren met de officiële Garmin-lezer
        run: |
          python3 -m venv /tmp/fitenv
          /tmp/fitenv/bin/pip install --quiet garmin-fit-sdk || { echo "::error::garmin-fit-sdk kon niet worden geinstalleerd"; exit 1; }
          /tmp/fitenv/bin/python - <<'EOF2'
          import sys, traceback
          try:
              from garmin_fit_sdk import Decoder, Stream
          except Exception as e:
              print(f"::error::Garmin-lezer niet beschikbaar: {e}"); sys.exit(1)
          def fail(msg):
              print(f"::error::FIT-controle: {msg}"); sys.exit(1)
          stream = Stream.from_file("build/test_course.fit")
          decoder = Decoder(stream)
          if not decoder.is_fit(): fail("geen FIT-bestand")
          if not decoder.check_integrity(): fail("controlegetal klopt niet")
          messages, errors = decoder.read()
          if errors: fail(f"leesfouten: {errors}")
          points = messages.get("course_point_mesgs", [])
          records = messages.get("record_mesgs", [])
          courses = messages.get("course_mesgs", [])
          if not courses: fail(f"geen course-bericht; gevonden: {list(messages.keys())}")
          course = courses[0]
          expected = [x for x in open("build/test_course_turns.txt").read().strip().split(",") if x]
          print(f"::notice::FIT-koers '{course.get('name')}' ({course.get('sport')}): {len(records)} punten, afslagen: {[p.get('type') for p in points]}")
          if messages["file_id_mesgs"][0].get("type") != "course": fail(f"bestandstype {messages['file_id_mesgs'][0]}")
          if course.get("sport") != "running": fail(f"sport {course}")
          if len(points) != len(expected): fail(f"{len(points)} afslagen in bestand, {len(expected)} verwacht")
          if not all(isinstance(p.get("type"), str) for p in points): fail(f"onbekend afslagtype: {points}")
          if len(records) <= 10: fail("te weinig punten")
          EOF2

      - name: APK bouwen
        if: ${{ !inputs.snel }}
        run: |
          set -o pipefail
          flutter build apk --release --dart-define-from-file=app_config.json --build-number=${{ github.run_number }} --build-name=1.1.${{ github.run_number }} --dart-define=APP_VERSION=1.1.${{ github.run_number }} 2>&1 | tee build.txt || {
            # Bouwfouten als leesbare meldingen tonen.
            grep -E -A8 "What went wrong|^e: |error:|Error:|FAILURE:|Could not resolve|requires|minSdk|compileSdk" build.txt | grep -v "^--$" | head -60 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      - name: APK beschikbaar maken
        if: ${{ !inputs.snel }}
        uses: actions/upload-artifact@v5
        with:
          name: runwise-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      # Vaste downloadlink: elke geslaagde build van main komt als runwise.apk bij de release "laatste".
      # Link voor je telefoon: https://github.com/Semdenhartog/Runwise/releases/download/laatste/runwise.apk
      - name: APK op de vaste downloadlink zetten
        if: ${{ !inputs.snel && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk runwise.apk
          if ! gh release view laatste >/dev/null 2>&1; then
            gh release create laatste --title "RunWise – nieuwste testversie" --notes "Altijd de nieuwste APK van main. Download op je telefoon: runwise.apk" --prerelease
          fi
          gh release upload laatste runwise.apk --clobber
          gh release edit laatste --notes "Versie 1.1.${{ github.run_number }} – $(git log -1 --pretty=%s | head -c 200)"
          echo "::notice::APK staat klaar op https://github.com/${GITHUB_REPOSITORY}/releases/download/laatste/runwise.apk"

      - name: Emulator klaarzetten (alleen bij handmatig starten)
        if: ${{ !inputs.snel && (github.event_name == 'workflow_dispatch') }}
        continue-on-error: true
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: App opstarten op een Android-emulator (test)
        if: ${{ !inputs.snel && (github.event_name == 'workflow_dispatch') }}
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: flutter test integration_test/app_test.dart --dart-define-from-file=app_config.json

      - name: App bundle voor de Play Store bouwen
        if: ${{ !inputs.snel && (env.HAS_UPLOAD_KEY == 'true') }}
        run: flutter build appbundle --release --dart-define-from-file=app_config.json --build-number=${{ github.run_number }} --build-name=1.1.${{ github.run_number }} --dart-define=APP_VERSION=1.1.${{ github.run_number }}

      - name: App bundle beschikbaar maken
        if: ${{ !inputs.snel && (env.HAS_UPLOAD_KEY == 'true') }}
        uses: actions/upload-artifact@v5
        with:
          name: runwise-playstore-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Uitleg als de sleutel nog ontbreekt
        if: ${{ !inputs.snel && (env.HAS_UPLOAD_KEY != 'true') }}
        run: echo "::notice::Geen Play Store-bundle gebouwd - voer eerst maak-sleutel.ps1 uit en zet de 4 geheimen in GitHub (zie README)."
